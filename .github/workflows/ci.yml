name: CI

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Trivy
        # Trivy's official installer, not the deb repo: `apt-key` was removed on
        # the ubuntu-26.04 runner image (2026-11-14, "sudo: 'apt-key': command not
        # found"), and the deb repo has no `resolute` dist either way. The installer
        # drops a static binary, so it is independent of the distro codename.
        run: |
          wget -qO- https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sudo sh -s -- -b /usr/local/bin

      - name: Run precommit checks
        run: make precommit
